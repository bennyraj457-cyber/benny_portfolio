<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#181917" />
  <title>BENNY R - Portfolio</title>
  <!-- Google Fonts: Newsreader & Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #181917;
      color: #fbf9f3;
      overflow: hidden;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 45%, #232421 0%, #141513 100%);
      font-family: 'Space Mono', monospace;
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.7s;
    }

    #initial-loader.loader-hidden {
      opacity: 0;
      transform: scale(1.03);
      visibility: hidden;
      pointer-events: none;
    }

    /* Subtle architectural grid background */
    .loader-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Animated 3D-style architectural rings */
    .loader-emblem {
      position: relative;
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .loader-ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 208, 0, 0.22);
      border-top-color: #f5d000;
      animation: loaderSpin 1.8s cubic-bezier(0.5, 0.15, 0.5, 0.85) infinite;
    }

    .loader-ring-inner {
      position: absolute;
      inset: 12px;
      border-radius: 50%;
      border: 1.5px dashed rgba(67, 157, 142, 0.45);
      animation: loaderSpinReverse 3.2s linear infinite;
    }

    .loader-core {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(245, 208, 0, 0.1);
      border: 1.5px solid #f5d000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 25px rgba(245, 208, 0, 0.28);
      font-weight: 700;
      font-size: 16px;
      color: #f5d000;
      letter-spacing: 0.05em;
    }

    .loader-heading {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 24px;
      font-weight: 500;
      color: #fbf9f3;
      letter-spacing: 0.04em;
      margin: 0 0 6px 0;
    }

    .loader-subtitle {
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(251, 249, 243, 0.55);
      margin: 0 0 24px 0;
    }

    .loader-bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 240px;
    }

    .loader-bar-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar-fill {
      width: 15%;
      height: 100%;
      background: linear-gradient(90deg, #439d8e, #f5d000);
      border-radius: 9999px;
      box-shadow: 0 0 12px rgba(245, 208, 0, 0.65);
      transition: width 0.25s ease-out;
    }

    .loader-status-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: #f5d000;
      text-transform: uppercase;
    }

    @keyframes loaderSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes loaderSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>

<body
  class="bg-surface text-on-surface font-serif antialiased selection:bg-primary-container selection:text-on-primary-container">
  <div id="initial-loader" aria-label="Loading 3D Studio">
    <div class="loader-grid"></div>
    <div class="loader-emblem">
      <div class="loader-ring-outer"></div>
      <div class="loader-ring-inner"></div>
      <div class="loader-core">BR</div>
    </div>
    <h1 class="loader-heading">Benny R</h1>
    <p class="loader-subtitle">3D Creative Studio &amp; Lab</p>
    <div class="loader-bar-wrapper">
      <div class="loader-bar-track">
        <div id="initial-loader-fill" class="loader-bar-fill"></div>
      </div>
      <div class="loader-status-row">
        <span id="initial-loader-text">Initializing 3D Room...</span>
        <span id="initial-loader-pct">15%</span>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var pct = 15;
      var fill = document.getElementById('initial-loader-fill');
      var pctEl = document.getElementById('initial-loader-pct');
      var txtEl = document.getElementById('initial-loader-text');
      window.__loaderInterval = setInterval(function () {
        if (pct < 88) {
          pct += Math.max(1, Math.floor((90 - pct) * 0.18));
          if (fill) fill.style.width = pct + '%';
          if (pctEl) pctEl.textContent = pct + '%';
          if (pct > 45 && pct <= 75 && txtEl) txtEl.textContent = 'Building 3D Studio...';
          else if (pct > 75 && txtEl) txtEl.textContent = 'Preparing Lighting...';
        }
      }, 120);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
